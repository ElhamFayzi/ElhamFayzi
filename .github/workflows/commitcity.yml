name: Update CommitCity
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: commitcity-update

jobs:
  skyline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Test renderer
        run: python3 -m unittest discover -s tests
      - name: Render skyline
        env:
          GITHUB_TOKEN: ${{ secrets.COMMITCITY_TOKEN || github.token }}
          COMMITCITY_USER: ${{ vars.COMMITCITY_USER || github.repository_owner }}
          COMMITCITY_THEME: ${{ vars.COMMITCITY_THEME || 'midnight' }}
        run: python3 commitcity.py --user "$COMMITCITY_USER" --theme "$COMMITCITY_THEME"
      - name: Publish updated SVG
        run: |
          git add assets/commitcity.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Update CommitCity skyline"
          git push
